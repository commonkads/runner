name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@commonkads'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm run test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-results
          path: test-results.xml

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@v6
        with:
          name: runner-tarball
          path: commonkads-runner-*.tgz
